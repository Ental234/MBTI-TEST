<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>공부 습관 자가진단 — MBTI 공부법 연구소</title>
  <meta name="description" content="10문항으로 알아보는 나의 학습 성향 그룹(NT·NF·SJ·SP) 자가진단." />
  <script>try{var t=localStorage.getItem("theme");if(t==="dark"||(!t&&window.matchMedia("(prefers-color-scheme:dark)").matches)){document.documentElement.setAttribute("data-theme","dark")}else if(t==="light"){document.documentElement.setAttribute("data-theme","light")}}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&family=IBM+Plex+Sans+KR:wght@300;400;600&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main>
    <section class="hero">
      <div class="container">
        <h1>공부 습관 자가진단</h1>
        <p>10개 문항에 답하면 나의 학습 성향 그룹을 알려드려요. 지금의 나에게 가장 가까운 것을 골라주세요.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <form id="quiz" class="quiz" novalidate></form>
        <div class="quiz-actions">
          <button type="button" id="submit-btn" class="btn btn-primary">결과 보기</button>
          <p id="quiz-error" class="error" hidden>아직 답하지 않은 문항이 있어요. 모두 골라주세요.</p>
        </div>
        <div id="result" hidden></div>
      </div>
    </section>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="js/common.js"></script>
  <script src="js/test.js"></script>
</body>
</html>
